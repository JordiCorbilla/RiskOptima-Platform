services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RISKOPTIMA_PLATFORM_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      RISKOPTIMA_PLATFORM_DATABASE_PATH: /app/data/riskoptima_platform.db
      RISKOPTIMA_PLATFORM_GENERATED_DATA_PATH: /app/generated_data
    volumes:
      - riskoptima-sqlite:/app/data
      - riskoptima-generated-runs:/app/generated_data
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/app/Dockerfile
    depends_on:
      - api
      - calendar
    ports:
      - "8080:80"

  calendar:
    build:
      context: ./economic-calendar
      dockerfile: RiskOptima.EconomicCalendar.Api/Dockerfile
    volumes:
      - ./economic-calendar/data:/app/data
    ports:
      - "127.0.0.1:5176:8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://web:80
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  riskoptima-sqlite:
  riskoptima-generated-runs:
